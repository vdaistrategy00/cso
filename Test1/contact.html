<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samsung AI TV - 문의하기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">SAMSUNG<span> AI TV</span></div>
    <ul class="nav-links">
      <li><a href="index.html">홈</a></li>
      <li><a href="features.html">제품 특징</a></li>
      <li><a href="ai-tech.html">AI 기술</a></li>
      <li><a href="models.html">모델 비교</a></li>
      <li><a href="contact.html" class="active">문의하기</a></li>
    </ul>
  </nav>

  <header class="page-header">
    <h1>문의하기</h1>
    <p>Samsung AI TV에 대한 궁금증을 남겨주시면 신속히 답변드리겠습니다</p>
  </header>

  <section class="container">
    <form class="contact-form" onsubmit="event.preventDefault(); alert('문의가 접수되었습니다. 빠른 시일 내에 연락드리겠습니다.'); this.reset();">
      <div class="form-group">
        <label for="name">이름 *</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-group">
        <label for="email">이메일 *</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="phone">연락처</label>
        <input type="tel" id="phone" name="phone" placeholder="010-0000-0000">
      </div>
      <div class="form-group">
        <label for="model">관심 모델</label>
        <select id="model" name="model">
          <option value="">선택해 주세요</option>
          <option value="neo-qled-8k">Neo QLED 8K (QN900D)</option>
          <option value="neo-qled-4k">Neo QLED 4K (QN95D)</option>
          <option value="oled">OLED (S95D)</option>
          <option value="undecided">아직 결정하지 않았어요</option>
        </select>
      </div>
      <div class="form-group">
        <label for="message">문의 내용 *</label>
        <textarea id="message" name="message" required placeholder="궁금하신 내용을 자유롭게 작성해 주세요"></textarea>
      </div>
      <button type="submit" class="btn" style="width:100%;">문의 보내기</button>
    </form>

    <div style="margin-top:60px; text-align:center;">
      <h3 style="font-size:1.5rem; margin-bottom:20px;">다른 문의 방법</h3>
      <p style="color:#aaa; margin-bottom:8px;">고객센터: 1588-3366 (평일 9시 ~ 18시)</p>
      <p style="color:#aaa; margin-bottom:8px;">이메일: aitv@samsung.com</p>
      <p style="color:#aaa;">가까운 삼성 디지털프라자에서도 상담 가능합니다</p>
    </div>
  </section>

  <footer class="footer">
    <p>© 2026 Samsung Electronics. All rights reserved.</p>
  </footer>
</body>
</html>
