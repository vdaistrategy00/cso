<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>테트리스</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    user-select: none;
  }
  h1 {
    margin-bottom: 16px;
    font-size: 28px;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #00f0f0, #f000f0, #f0a000);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .game {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  canvas {
    background: #0d0d1a;
    border: 2px solid #2a2a4a;
    border-radius: 6px;
    box-shadow: 0 0 30px rgba(0, 240, 240, 0.15);
  }
  .panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 140px;
  }
  .box {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid #2a2a4a;
    border-radius: 6px;
    padding: 12px;
  }
  .box h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #8888aa;
    margin-bottom: 8px;
  }
  .box .value {
    font-size: 26px;
    font-weight: bold;
    color: #00f0f0;
  }
  .controls {
    font-size: 12px;
    line-height: 1.8;
    color: #aaaacc;
  }
  .controls b { color: #f0a000; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 12px;
    font-size: 15px;
    font-weight: bold;
    color: #0d0d1a;
    background: linear-gradient(90deg, #00f0f0, #00a0f0);
    transition: transform 0.1s, box-shadow 0.2s;
  }
  button:hover { box-shadow: 0 0 16px rgba(0, 240, 240, 0.5); }
  button:active { transform: scale(0.96); }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay h2 { font-size: 40px; color: #f000f0; }
  .overlay p { font-size: 18px; color: #ccc; }
</style>
</head>
<body>
  <h1>T E T R I S</h1>
  <div class="game">
    <canvas id="board" width="300" height="600"></canvas>
    <div class="panel">
      <div class="box">
        <h2>다음 블록</h2>
        <canvas id="next" width="116" height="116"></canvas>
      </div>
      <div class="box">
        <h2>점수</h2>
        <div class="value" id="score">0</div>
      </div>
      <div class="box">
        <h2>라인</h2>
        <div class="value" id="lines">0</div>
      </div>
      <div class="box">
        <h2>레벨</h2>
        <div class="value" id="level">1</div>
      </div>
      <button id="startBtn">게임 시작</button>
      <div class="box controls">
        <b>←</b> <b>→</b> 이동<br>
        <b>↓</b> 빠르게<br>
        <b>↑</b> 회전<br>
        <b>Space</b> 하드드롭<br>
        <b>P</b> 일시정지
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <h2 id="overlayTitle">게임 오버</h2>
    <p id="overlaySub">다시 시작하려면 버튼을 누르세요</p>
    <button id="restartBtn">다시 시작</button>
  </div>

<script>
const COLS = 10, ROWS = 20, BLOCK = 30;
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const nextCanvas = document.getElementById('next');
const nctx = nextCanvas.getContext('2d');

const COLORS = {
  I: '#00f0f0', O: '#f0f000', T: '#a000f0',
  S: '#00f000', Z: '#f00000', J: '#0000f0', L: '#f0a000'
};
const SHAPES = {
  I: [[1,1,1,1]],
  O: [[1,1],[1,1]],
  T: [[0,1,0],[1,1,1]],
  S: [[0,1,1],[1,1,0]],
  Z: [[1,1,0],[0,1,1]],
  J: [[1,0,0],[1,1,1]],
  L: [[0,0,1],[1,1,1]]
};
const TYPES = Object.keys(SHAPES);

let board, current, next, score, lines, level;
let dropInterval, dropCounter, lastTime, running, paused, gameOver;
let rafId = null;

function newBoard() {
  return Array.from({length: ROWS}, () => Array(COLS).fill(null));
}

function randomPiece() {
  const type = TYPES[Math.floor(Math.random() * TYPES.length)];
  const shape = SHAPES[type].map(r => [...r]);
  return { type, shape, x: Math.floor((COLS - shape[0].length) / 2), y: 0 };
}

function rotate(shape) {
  const rows = shape.length, cols = shape[0].length;
  const res = Array.from({length: cols}, () => Array(rows).fill(0));
  for (let y = 0; y < rows; y++)
    for (let x = 0; x < cols; x++)
      res[x][rows - 1 - y] = shape[y][x];
  return res;
}

function collide(piece, board) {
  const { shape, x: px, y: py } = piece;
  for (let y = 0; y < shape.length; y++) {
    for (let x = 0; x < shape[y].length; x++) {
      if (!shape[y][x]) continue;
      const nx = px + x, ny = py + y;
      if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
      if (ny >= 0 && board[ny][nx]) return true;
    }
  }
  return false;
}

function merge(piece, board) {
  piece.shape.forEach((row, y) => {
    row.forEach((v, x) => {
      if (v && piece.y + y >= 0) board[piece.y + y][piece.x + x] = piece.type;
    });
  });
}

function clearLines() {
  let cleared = 0;
  outer: for (let y = ROWS - 1; y >= 0; y--) {
    for (let x = 0; x < COLS; x++) if (!board[y][x]) continue outer;
    board.splice(y, 1);
    board.unshift(Array(COLS).fill(null));
    cleared++;
    y++;
  }
  if (cleared > 0) {
    const points = [0, 100, 300, 500, 800];
    score += points[cleared] * level;
    lines += cleared;
    level = Math.floor(lines / 10) + 1;
    dropInterval = Math.max(80, 1000 - (level - 1) * 90);
    updateStats();
  }
}

function updateStats() {
  document.getElementById('score').textContent = score;
  document.getElementById('lines').textContent = lines;
  document.getElementById('level').textContent = level;
}

function spawn() {
  current = next;
  next = randomPiece();
  drawNext();
  if (collide(current, board)) endGame();
}

function lockPiece() {
  merge(current, board);
  clearLines();
  spawn();
}

function drop() {
  current.y++;
  if (collide(current, board)) {
    current.y--;
    lockPiece();
  }
  dropCounter = 0;
}

function hardDrop() {
  while (!collide(current, board)) current.y++;
  current.y--;
  lockPiece();
  dropCounter = 0;
}

function move(dir) {
  current.x += dir;
  if (collide(current, board)) current.x -= dir;
}

function tryRotate() {
  const rotated = rotate(current.shape);
  const prev = current.shape;
  current.shape = rotated;
  const kicks = [0, -1, 1, -2, 2];
  for (const k of kicks) {
    current.x += k;
    if (!collide(current, board)) return;
    current.x -= k;
  }
  current.shape = prev;
}

function drawCell(c, x, y, type) {
  const color = COLORS[type];
  c.fillStyle = color;
  c.fillRect(x * BLOCK, y * BLOCK, BLOCK, BLOCK);
  c.fillStyle = 'rgba(255,255,255,0.25)';
  c.fillRect(x * BLOCK, y * BLOCK, BLOCK, 4);
  c.fillRect(x * BLOCK, y * BLOCK, 4, BLOCK);
  c.strokeStyle = 'rgba(0,0,0,0.4)';
  c.lineWidth = 1;
  c.strokeRect(x * BLOCK + 0.5, y * BLOCK + 0.5, BLOCK - 1, BLOCK - 1);
}

function draw() {
  ctx.fillStyle = '#0d0d1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // grid
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x * BLOCK, 0); ctx.lineTo(x * BLOCK, canvas.height); ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0, y * BLOCK); ctx.lineTo(canvas.width, y * BLOCK); ctx.stroke();
  }
  // settled
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (board[y][x]) drawCell(ctx, x, y, board[y][x]);
  // ghost
  if (current) {
    const ghost = { ...current, shape: current.shape };
    let gy = current.y;
    const temp = { type: current.type, shape: current.shape, x: current.x, y: gy };
    while (!collide(temp, board)) temp.y++;
    temp.y--;
    ctx.globalAlpha = 0.2;
    temp.shape.forEach((row, y) => row.forEach((v, x) => {
      if (v && temp.y + y >= 0) drawCell(ctx, temp.x + x, temp.y + y, temp.type);
    }));
    ctx.globalAlpha = 1;
    // current
    current.shape.forEach((row, y) => row.forEach((v, x) => {
      if (v && current.y + y >= 0) drawCell(ctx, current.x + x, current.y + y, current.type);
    }));
  }
}

function drawNext() {
  nctx.fillStyle = '#0d0d1a';
  nctx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
  if (!next) return;
  const s = next.shape;
  const size = 26;
  const offX = (nextCanvas.width - s[0].length * size) / 2;
  const offY = (nextCanvas.height - s.length * size) / 2;
  s.forEach((row, y) => row.forEach((v, x) => {
    if (!v) return;
    nctx.fillStyle = COLORS[next.type];
    nctx.fillRect(offX + x * size, offY + y * size, size, size);
    nctx.strokeStyle = 'rgba(0,0,0,0.4)';
    nctx.strokeRect(offX + x * size + 0.5, offY + y * size + 0.5, size - 1, size - 1);
  }));
}

function update(time = 0) {
  if (!running || paused || gameOver) return;
  const delta = time - lastTime;
  lastTime = time;
  dropCounter += delta;
  if (dropCounter > dropInterval) drop();
  draw();
  rafId = requestAnimationFrame(update);
}

function startGame() {
  board = newBoard();
  score = 0; lines = 0; level = 1;
  dropInterval = 1000; dropCounter = 0; lastTime = performance.now();
  running = true; paused = false; gameOver = false;
  next = randomPiece();
  spawn();
  updateStats();
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('startBtn').textContent = '재시작';
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(update);
}

function endGame() {
  gameOver = true;
  running = false;
  document.getElementById('overlayTitle').textContent = '게임 오버';
  document.getElementById('overlaySub').textContent = `최종 점수: ${score}`;
  document.getElementById('overlay').classList.add('show');
}

function togglePause() {
  if (!running || gameOver) return;
  paused = !paused;
  if (!paused) {
    lastTime = performance.now();
    rafId = requestAnimationFrame(update);
  }
}

document.addEventListener('keydown', e => {
  if (!running || gameOver) return;
  if (paused && e.key.toLowerCase() !== 'p') return;
  switch (e.key) {
    case 'ArrowLeft': move(-1); draw(); break;
    case 'ArrowRight': move(1); draw(); break;
    case 'ArrowDown': drop(); draw(); break;
    case 'ArrowUp': tryRotate(); draw(); break;
    case ' ': e.preventDefault(); hardDrop(); draw(); break;
    case 'p': case 'P': togglePause(); break;
  }
  if ([' ', 'ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp'].includes(e.key)) e.preventDefault();
});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

// initial empty render
board = newBoard();
draw();
</script>
</body>
</html>
